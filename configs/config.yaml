# TravelNext configuration.
# Every setting here is free-tier / local only. No API keys anywhere.

project:
  name: travelnext
  random_seed: 42

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  models: models
  reports: reports
  figures: reports/figures

# ---------------------------------------------------------------- ingestion
ingest:
  # Politeness settings for the free public APIs we depend on.
  # The Wikimedia User-Agent policy asks for a contact URL and throttles
  # generic agents with HTTP 429. Point this at your own fork before running a
  # full ingestion.
  user_agent: "TravelNext/0.1 (https://github.com/travelnext/travelnext; open-source travel recommender; educational use)"
  request_timeout_s: 60
  # Minimum population for a settlement to enter the candidate pool (Wikidata).
  min_population: 100000
  # After ranking candidates by Wikipedia pageviews we keep this many cities.
  # This keeps the Overpass (OpenStreetMap) load respectful and the dataset
  # small enough for an 8GB laptop.
  catalog_size: 800
  pageviews:
    # Trailing window used as the popularity proxy.
    months: 24
    max_workers: 8
    retries: 2
  overpass:
    endpoints:
      - "https://overpass-api.de/api/interpreter"
      - "https://overpass.kumi.systems/api/interpreter"
    radius_m: 5000
    timeout_s: 90
    # Seconds to sleep between city queries. Do not lower this: the endpoint
    # is a free community service.
    sleep_between_s: 1.5
    retries: 3
  climate:
    # Daily data aggregated into monthly normals.
    start_date: "2020-01-01"
    end_date: "2024-12-31"
    max_workers: 4
  worldbank:
    # GNI per capita, PPP (current international $) -> cost proxy.
    indicator: "NY.GNP.PCAP.PP.CD"

# ------------------------------------------------------------- interactions
# Synthetic travel interactions. These are NOT real users.
interactions:
  n_users: 4000
  min_trips: 3
  max_trips: 12
  # Higher -> users stick more tightly to their preference archetype.
  preference_sharpness: 6.0
  # Probability a trip is drawn from popularity rather than preference,
  # which injects realistic popularity bias into the data.
  popularity_mix: 0.30
  # Probability the next trip is drawn near the previous one (trip chaining).
  geo_chain_prob: 0.35
  geo_chain_scale_km: 700.0

# -------------------------------------------------------------- evaluation
evaluation:
  k_values: [5, 10, 20]
  # Leave-last-n-out split over each user's ordered trip sequence.
  test_holdout: 2
  val_holdout: 2
  min_train_trips: 2

# ------------------------------------------------------------------ models
models:
  content:
    tfidf_max_features: 20000
    tfidf_ngram_max: 2
    # Weight of the TF-IDF text block vs. the numeric attribute block.
    text_weight: 0.45
    attribute_weight: 0.55
    # Recency weighting of a user's past trips when building their profile.
    recency_decay: 0.85
  collaborative:
    # Truncated SVD latent factors for the item-item model.
    n_components: 64
    # Shrinkage on item-item cosine similarity counts.
    shrinkage: 10.0
    top_k_neighbours: 200
  hybrid:
    # Defaults only. tune_hybrid.py overwrites these from validation data.
    alpha_content: 0.4
    beta_collaborative: 0.4
    gamma_popularity: 0.2

candidate_generation:
  n_candidates: 150
  # How many candidates each source contributes before de-duplication.
  per_source:
    content: 80
    collaborative: 80
    geographic: 40
    popularity: 40

ranking:
  lightgbm:
    objective: lambdarank
    metric: ndcg
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.9
    colsample_bytree: 0.9
    lambda_l2: 1.0
    n_jobs: 4
    verbose: -1
  early_stopping_rounds: 50
  # Number of sampled negatives per positive when building training groups.
  negatives_per_positive: 30

api:
  host: "0.0.0.0"
  port: 8000
  default_k: 10
  max_k: 50
