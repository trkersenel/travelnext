# TravelNext configuration.
# Every setting here is free-tier / local only. No API keys anywhere.

project:
  name: travelnext
  random_seed: 42

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  models: models
  reports: reports
  figures: reports/figures

# ---------------------------------------------------------------- ingestion
ingest:
  # Politeness settings for the free public APIs we depend on.
  # The Wikimedia User-Agent policy asks for a contact URL and throttles
  # generic agents with HTTP 429. Point this at your own fork before running a
  # full ingestion.
  user_agent: "TravelNext/0.1 (https://github.com/trkersenel/travelnext; open-source travel recommender; educational use)"
  request_timeout_s: 60
  # Minimum population for a settlement to enter the candidate pool (GeoNames).
  min_population: 100000
  # After ranking candidates by Wikipedia pageviews we keep this many cities.
  # Sized by what the free Overpass API can serve responsibly: it grants ~2
  # query slots per client, so each destination costs real time on a donated
  # service. 400 destinations across ~100 countries is enough for meaningful
  # recommendations while keeping a full ingest under an hour.
  catalog_size: 400
  pageviews:
    # Trailing window used as the popularity proxy.
    months: 24
    max_workers: 8
    retries: 2
  overpass:
    # One worker thread is pinned to each mirror, so this list also sets the
    # concurrency. All three were verified to serve global data; regional
    # extracts (e.g. overpass.osm.ch) must NOT be added here -- they answer
    # with 200 and a count of zero outside their own country, which would look
    # like "this city has no museums" rather than an error.
    endpoints:
      - "https://overpass-api.de/api/interpreter"
      - "https://overpass.kumi.systems/api/interpreter"
      - "https://maps.mail.ru/osm/tools/overpass/api/interpreter"
    # 4km around the city centre. Larger radii make Overpass queries
    # markedly more expensive for little extra signal.
    radius_m: 4000
    timeout_s: 90
    # Seconds to sleep between city queries. Do not lower this: the endpoint
    # is a free community service that grants only a couple of slots per client.
    sleep_between_s: 3.0
    retries: 5
  climate:
    # Daily data aggregated into monthly normals.
    start_date: "2020-01-01"
    end_date: "2024-12-31"
    max_workers: 4
  worldbank:
    # GNI per capita, PPP (current international $) -> cost proxy.
    indicator: "NY.GNP.PCAP.PP.CD"

# ------------------------------------------------------------- interactions
# Synthetic travel interactions. These are NOT real users.
interactions:
  n_users: 4000
  min_trips: 3
  max_trips: 12
  # Higher -> users stick more tightly to their preference archetype.
  preference_sharpness: 6.0
  # Probability a trip is drawn from popularity rather than preference,
  # which injects realistic popularity bias into the data.
  popularity_mix: 0.30
  # Probability the next trip is drawn near the previous one (trip chaining).
  geo_chain_prob: 0.35
  geo_chain_scale_km: 700.0

# -------------------------------------------------------------- evaluation
evaluation:
  k_values: [5, 10, 20]
  # Leave-last-n-out split over each user's ordered trip sequence.
  test_holdout: 2
  val_holdout: 2
  min_train_trips: 2

# ------------------------------------------------------------------ models
models:
  content:
    tfidf_max_features: 20000
    tfidf_ngram_max: 2
    # Weight of the TF-IDF text block vs. the numeric attribute block.
    # Selected on the VALIDATION split (test untouched): 0.85 scored 0.0845
    # NDCG@10 against 0.0644 for attributes alone and 0.0734 for text alone.
    # The text blob carries country/region/continent tokens, so it also encodes
    # the geographic relationships that pure attribute shares cannot.
    text_weight: 0.85
    attribute_weight: 0.15
    # Recency weighting of a user's past trips when building their profile.
    recency_decay: 0.85
  collaborative:
    # Truncated SVD latent factors for the item-item model.
    n_components: 64
    # Shrinkage on item-item cosine similarity counts.
    shrinkage: 10.0
    top_k_neighbours: 200
  hybrid:
    # Starting point for the validation search in tune_hybrid.py. The searched
    # result is reported in reports/RESULTS.md; it is NOT written back here.
    alpha_content: 0.4
    beta_collaborative: 0.4
    gamma_popularity: 0.2
    delta_context: 0.0

    # ---- weights actually used when SERVING recommendations ----------------
    # These deliberately differ from the validation-optimal weights, and the
    # reason is important enough to spell out.
    #
    # Tuning on the synthetic interactions selects collaborative = 1.00: on
    # those labels nothing else helps, because the generator's dominant
    # mechanism is co-visitation and item-item CF models it directly. But a
    # model fitted on synthetic co-visitation produces poor *real* answers. For
    # a traveller returning from Amsterdam, Berlin and Prague the metric-optimal
    # blend recommends Mobile (Alabama), Abuja and Belgrade, while the content
    # model -- the only component grounded in real measured data (OpenStreetMap,
    # climate, Wikipedia) -- returns Munich, Hamburg and Frankfurt.
    #
    # So the served blend keeps a substantial content and context weight. This
    # is a documented product judgement, not a metric claim: it would be
    # dishonest to report it as "tuned", and equally dishonest to ship
    # recommendations we know are bad because a synthetic-label metric likes
    # them. With real interaction data, tune these on the data instead.
    serving:
      content: 0.35
      collaborative: 0.25
      popularity: 0.10
      context: 0.30

candidate_generation:
  # Sized relative to the catalog. Measured: with 150 candidates from a
  # 400-destination catalog, stage-1 recall was only 0.72, which capped the
  # ranker below plain collaborative filtering -- the ranker cannot recover an
  # answer that retrieval already discarded. Raise this if the catalog grows.
  n_candidates: 250
  # How many candidates each source contributes before de-duplication.
  per_source:
    content: 120
    collaborative: 150
    geographic: 80
    popularity: 60

ranking:
  lightgbm:
    objective: lambdarank
    metric: ndcg
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.9
    colsample_bytree: 0.9
    lambda_l2: 1.0
    n_jobs: 4
    verbose: -1
  early_stopping_rounds: 50
  # Number of sampled negatives per positive when building training groups.
  # Swept on validation against the 250-candidate inference set: 30 -> 0.2470,
  # 60 -> 0.2484, 120 -> 0.2429, 249 -> 0.2475 NDCG@10. Essentially flat, so
  # train/serve mismatch in negative sampling is NOT what holds the ranker
  # back; 60 is kept as the marginal best.
  negatives_per_positive: 60

api:
  host: "0.0.0.0"
  port: 8000
  default_k: 10
  max_k: 50
